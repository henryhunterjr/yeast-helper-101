name: Patch nanoid security advisory

on:
  push:
    branches:
      - security/nanoid-3.3.18

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[nanoid patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: security/nanoid-3.3.18
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch nanoid lockfile entry only
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(p, 'utf8'));
          const entry = lock.packages?.['node_modules/nanoid'];
          if (!entry) throw new Error('nanoid lockfile entry not found');
          entry.version = '3.3.18';
          entry.resolved = 'https://registry.npmjs.org/nanoid/-/nanoid-3.3.18.tgz';
          entry.integrity = 'sha512-DTg4MJbGMWkfi6VZFdNt2/caMbQy4Ou+Op/hJQvGEWcnVfoA1QA+xzRKAzw9jD6+GVOOeYr/mIcuDSdug6F6+w==';
          fs.writeFileSync(p, JSON.stringify(lock, null, 2) + '\n');
          NODE
          cp package-lock.json /tmp/security-package-lock.json

      - name: Verify patched dependency and build
        shell: bash
        run: |
          node -e "const l=require('./package-lock.json'); const v=l.packages?.['node_modules/nanoid']?.version; if(v!=='3.3.18'){throw new Error('Expected nanoid 3.3.18, found '+v)}"
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          cp /tmp/security-package-lock.json package-lock.json
          node -e "const l=require('./package-lock.json'); const v=l.packages?.['node_modules/nanoid']?.version; if(v!=='3.3.18'){throw new Error('Expected nanoid 3.3.18 after restore, found '+v)}"

      - name: Commit security fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch-nanoid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/patch-nanoid.yml
          git commit -m "fix: update nanoid to 3.3.18 [nanoid patched]"
          git push origin HEAD:security/nanoid-3.3.18
